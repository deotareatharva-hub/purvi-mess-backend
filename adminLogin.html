<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purvi Mess Services Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f5ead7;
        font-family: "DM Sans", sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* Tiffin SVG background */
      .bg-tiffin {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-58%, -50%);
        width: 420px;
        opacity: 0.55;
        pointer-events: none;
        user-select: none;
      }

      /* Popup overlay */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.18);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .overlay.show {
        display: flex;
      }

      .popup {
        background: #fff;
        border-radius: 20px;
        padding: 36px 40px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.14);
        max-width: 320px;
        width: 90%;
        animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes popIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .popup-icon {
        width: 54px;
        height: 54px;
        background: #fee2e2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }
      .popup-icon svg {
        width: 26px;
        height: 26px;
      }

      .popup h3 {
        font-size: 17px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 8px;
      }
      .popup p {
        font-size: 13.5px;
        color: #666;
        line-height: 1.5;
        margin-bottom: 22px;
      }
      .popup-btn {
        background: #e74c3c;
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 11px 36px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        transition: background 0.2s;
      }
      .popup-btn:hover {
        background: #c0392b;
      }

      /* Card */
      .card {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 28px;
        padding: 46px 44px 42px;
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 2;
        box-shadow:
          0 2px 0 rgba(255, 255, 255, 0.9) inset,
          0 24px 60px rgba(180, 140, 80, 0.13),
          0 4px 20px rgba(0, 0, 0, 0.06);
      }

      h1 {
        font-size: 26px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: center;
        margin-bottom: 32px;
        letter-spacing: -0.3px;
        line-height: 1.25;
      }

      .field {
        position: relative;
        margin-bottom: 14px;
      }

      .field-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #aaa;
        display: flex;
        align-items: center;
      }

      input[type="text"],
      input[type="password"],
      input[type="email"] {
        width: 100%;
        background: #f7f3ec;
        border: 1.5px solid transparent;
        border-radius: 50px;
        padding: 14px 46px 14px 44px;
        font-size: 14.5px;
        font-family: "DM Sans", sans-serif;
        color: #2a2a2a;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        -webkit-appearance: none;
      }
      input::placeholder {
        color: #b5a99a;
      }
      input:focus {
        border-color: #4caf50;
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.12);
        background: #fff;
      }

      .eye-btn {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #aaa;
        display: flex;
        align-items: center;
        padding: 0;
        transition: color 0.2s;
      }
      .eye-btn:hover {
        color: #555;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 14px 0 22px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 13.5px;
        color: #555;
        user-select: none;
      }

      .remember input[type="checkbox"] {
        width: 17px;
        height: 17px;
        border-radius: 4px;
        accent-color: #4caf50;
        cursor: pointer;
        padding: 0;
        border: 1.5px solid #ccc;
        background: #fff;
        flex-shrink: 0;
      }

      .forgot {
        font-size: 13.5px;
        color: #7a7a7a;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }
      .forgot:hover {
        color: #4caf50;
      }

      .login-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #56c45a 0%, #3da840 100%);
        color: #fff;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        font-family: "DM Sans", sans-serif;
        cursor: pointer;
        letter-spacing: 0.2px;
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.35);
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          filter 0.15s;
      }
      .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 28px rgba(76, 175, 80, 0.42);
        filter: brightness(1.04);
      }
      .login-btn:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
      }

      /* shake animation on wrong password */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }
      .shake {
        animation: shake 0.4s ease;
      }
    </style>
  </head>
  <body>
    <!-- Background tiffin illustration -->
     
    <!-- Card -->
    <div class="card" id="card">
      <h1>Purvi Mess Services Admin</h1>

      <div class="field">
        <span class="field-icon">
          <svg
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            viewBox="0 0 24 24"
          >
            <rect x="5" y="2" width="14" height="20" rx="2" />
            <line
              x1="12"
              y1="18"
              x2="12"
              y2="18.5"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <input
          type="text"
          id="username"
          placeholder="Phone number or Email"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <span class="field-icon">
          <svg
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            viewBox="0 0 24 24"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="off"
        />
        <button
          class="eye-btn"
          id="eyeBtn"
          type="button"
          onclick="togglePass()"
        >
          <svg
            id="eyeIcon"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            viewBox="0 0 24 24"
          >
            <path
              d="M17.94 17.94A10.06 10.06 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
            />
            <path
              d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
            />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>

      

      <button class="login-btn" onclick="handleLogin()">Login</button>
    </div>

    <!-- Error Popup -->
    <div class="overlay" id="overlay" onclick="closePopup(event)">
      <div class="popup">
        <div class="popup-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#e74c3c"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <circle cx="12" cy="16" r="0.5" fill="#e74c3c" stroke-width="2.5" />
          </svg>
        </div>
        <h3>Invalid Credentials</h3>
        <p>
          The username or password you entered is incorrect. Please try again.
        </p>
        <button class="popup-btn" onclick="closePopup()">Try Again</button>
      </div>
    </div>

    <script>
      const VALID_USER = "BhartiDeotare";
      const VALID_PASS = "atharvapurvi270612";

      function handleLogin() {
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value;

        if (user === VALID_USER && pass === VALID_PASS) {
          const btn = document.querySelector(".login-btn");
          btn.textContent = "✓ Logging in...";
          btn.style.background = "linear-gradient(135deg,#43a047,#2e7d32)";
          setTimeout(() => {
            window.location.href = "adminhome.html";
          }, 800);
        } else {
          // Shake the card
          const card = document.getElementById("card");
          card.classList.remove("shake");
          void card.offsetWidth;
          card.classList.add("shake");
          setTimeout(() => card.classList.remove("shake"), 500);
          // Show popup
          document.getElementById("overlay").classList.add("show");
        }
      }

      function closePopup(e) {
        if (
          !e ||
          e.target === document.getElementById("overlay") ||
          e.target.classList.contains("popup-btn")
        ) {
          document.getElementById("overlay").classList.remove("show");
          document.getElementById("password").value = "";
          document.getElementById("password").focus();
        }
      }

      function togglePass() {
        const inp = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");
        if (inp.type === "password") {
          inp.type = "text";
          icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        } else {
          inp.type = "password";
          icon.innerHTML = `<path d="M17.94 17.94A10.06 10.06 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
        }
      }

      // Allow Enter key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin();
      });
    </script>
  </body>
</html>
